name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install (full workspace, needed for shared/server/client/tests)
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (shared -> server -> client, same order as npm run build)
        run: npm run build

      - name: Test (packages/tests, jest)
        run: npm run test

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No push — just confirms the Dockerfile still builds against current
      # source, matching the other repos' docker-validate job.
      - name: Build production image
        run: docker build -t delivery-city:ci-check .
