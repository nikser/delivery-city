name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install (full workspace, needed for shared/server/client/tests)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (shared -> server -> client, same order as npm run build)
        run: npm run build

      - name: Test (packages/tests, vitest)
        run: npm run test

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No push — just confirms the Dockerfile still builds against current
      # source, matching the other repos' docker-validate job.
      - name: Build production image
        run: docker build -t delivery-city:ci-check .
      # Catches crashes at startup (e.g. the Express 5 '*' route) that build and unit tests miss.
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 3001:3001 delivery-city:ci-check
          for i in $(seq 1 15); do curl -fs http://localhost:3001/ | grep -q '<title>Delivery City' && curl -fs 'http://localhost:3001/socket.io/?EIO=4&transport=polling' | grep -q sid && exit 0; sleep 2; done
          docker logs smoke; exit 1
